<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنصيب لايت بوت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* خلفية فيديو Catbox */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.4) contrast(1.15);
        }

        /* طبقة التظليل فوق الفيديو */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(15,2,2,0.2) 0%, rgba(5,5,8,0.85) 100%);
            z-index: -1;
        }

        /* الكارت الرئيسي الأحمر */
        .main-card {
            background: rgba(18, 12, 20, 0.85);
            backdrop-filter: blur(16px);
            border: 2px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            width: 100%;
            max-width: 420px;
        }

        /* المربع الأحمر المضيء للصورة */
        .avatar-red-box {
            width: 90px;
            height: 90px;
            border: 3px solid #ef4444;
            box-shadow: 0 0 20px #ef4444, inset 0 0 10px #ef4444;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px #ef4444, inset 0 0 5px #ef4444;
                border-color: #ef4444;
            }
            100% {
                box-shadow: 0 0 25px #dc2626, inset 0 0 12px #dc2626;
                border-color: #f87171;
            }
        }

        /* الصندوق الداخلي */
        .inner-card {
            background: rgba(10, 8, 15, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .light-title {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        }

        /* تعديل خانة الإدخال لتظهر بشكل مظبوط */
        #phoneInput {
            direction: ltr;
            text-align: center;
        }
        #phoneInput::placeholder {
            direction: rtl;
            text-align: center;
        }
    </style>
</head>
<body class="p-4">

    <!-- فيديو الخلفية من رابط Catbox -->
    <video class="video-bg" autoplay loop muted playsinline preload="auto">
        <source src="https://files.catbox.moe/uee4x1.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>
    <div class="overlay"></div>

    <!-- الكارت الرئيسي للموقع -->
    <div class="main-card rounded-3xl p-6 text-center space-y-6">
        
        <!-- الصورة داخل مربع أحمر -->
        <div class="avatar-red-box mx-auto rounded-2xl p-1 flex items-center justify-center">
            <img src="https://i.supaimg.com/374589ce-56ae-4068-ba73-60f3b228637f/df4a4068-978a-4f77-afa8-bb5dd22968e1.jpg" 
                 alt="LIGHT" 
                 class="w-full h-full rounded-xl object-cover">
        </div>

        <!-- العنوان -->
        <div>
            <h1 class="text-3xl font-black text-red-500 tracking-wider light-title">LIGHT-BOT</h1>
            <p class="text-gray-300 text-sm mt-1.5 font-medium">احصل على كود الاقتران لربط البوت بسهولة</p>
        </div>

        <!-- المدخلات -->
        <div class="inner-card rounded-2xl p-5 text-right space-y-4">
            
            <!-- رقم الهاتف -->
            <div>
                <label class="text-red-300 text-xs font-bold flex items-center gap-1.5 mb-2">
                    <i class="fa-solid fa-mobile-screen-button text-red-500"></i> ادخل رقم الهاتف الخاص بك
                </label>
                <input type="tel" id="phoneInput" placeholder="2189457XXXXXX" 
                       class="w-full px-4 py-3 bg-[#08060a] text-red-100 border border-red-900/60 rounded-xl focus:outline-none focus:border-red-500 text-lg placeholder-gray-600 font-mono tracking-wider">
            </div>

            <!-- الزر الوحيد -->
            <button onclick="requestCode()" id="submitBtn" 
                    class="w-full py-3.5 bg-gradient-to-r from-red-700 via-red-600 to-rose-700 hover:from-red-800 hover:to-rose-800 text-white font-bold text-base rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 border border-red-500/30">
                <i class="fa-solid fa-key"></i> طلب كود الاقتران
            </button>

            <!-- نتيجة الكود -->
            <div id="resultBox" class="hidden space-y-3 p-4 bg-[#08060a] rounded-xl border border-red-600/50 mt-4 text-center">
                <p class="text-xs text-gray-400">رمز الاقتران الخاص بك هو:</p>
                <div id="codeDisplay" class="text-3xl font-mono font-bold text-red-500 select-all tracking-widest">--------</div>
                <button onclick="copyCode()" class="px-4 py-2 bg-red-950/80 hover:bg-red-900 text-xs text-red-200 rounded-lg border border-red-600/40 transition">
                    نسخ الرمز <i class="fa-regular fa-copy mr-1"></i>
                </button>
            </div>

        </div>

        <!-- التذييل -->
        <div class="text-gray-400 text-xs space-y-1">
            <p>المطور: <span class="text-red-500 font-bold">Ahmed</span></p>
        </div>

    </div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنصيب لايت بوت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* الكارت الرئيسي الأحمر */
        .main-card {
            background: rgba(18, 12, 20, 0.95);
            backdrop-filter: blur(16px);
            border: 2px solid #ef4444;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            width: 100%;
            max-width: 420px;
        }

        /* المربع الأحمر المضيء المحتوي على الفيديو */
        .avatar-red-box {
            width: 110px;
            height: 110px;
            border: 3px solid #ef4444;
            box-shadow: 0 0 20px #ef4444, inset 0 0 10px #ef4444;
            animation: pulseGlow 2s infinite alternate;
            overflow: hidden; /* لحصر الفيديو داخل المربع تماماً */
            border-radius: 1rem;
        }

        .avatar-red-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px #ef4444, inset 0 0 5px #ef4444;
                border-color: #ef4444;
            }
            100% {
                box-shadow: 0 0 25px #dc2626, inset 0 0 12px #dc2626;
                border-color: #f87171;
            }
        }

        /* الصندوق الداخلي */
        .inner-card {
            background: rgba(10, 8, 15, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .light-title {
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        }

        /* ضبط خانة رقم الهاتف */
        #phoneInput {
            direction: ltr;
            text-align: center;
        }
        #phoneInput::placeholder {
            direction: rtl;
            text-align: center;
        }
    </style>
</head>
<body class="p-4">

    <!-- الكارت الرئيسي للموقع -->
    <div class="main-card rounded-3xl p-6 text-center space-y-6">
        
        <!-- الفيديو محصور تماماً داخل المربع الأحمر -->
        <div class="avatar-red-box mx-auto p-0 flex items-center justify-center">
            <video autoplay loop muted playsinline preload="auto">
                <source src="https://files.catbox.moe/uee4x1.mp4" type="video/mp4">
            </video>
        </div>

        <!-- العنوان -->
        <div>
            <h1 class="text-3xl font-black text-red-500 tracking-wider light-title">LIGHT-BOT</h1>
            <p class="text-gray-300 text-sm mt-1.5 font-medium">احصل على كود الاقتران لربط البوت بسهولة</p>
        </div>

        <!-- المدخلات -->
        <div class="inner-card rounded-2xl p-5 text-right space-y-4">
            
            <!-- رقم الهاتف -->
            <div>
                <label class="text-red-300 text-xs font-bold flex items-center gap-1.5 mb-2">
                    <i class="fa-solid fa-mobile-screen-button text-red-500"></i> ادخل رقم الهاتف الخاص بك
                </label>
                <input type="tel" id="phoneInput" placeholder="2189457XXXXXX" 
                       class="w-full px-4 py-3 bg-[#08060a] text-red-100 border border-red-900/60 rounded-xl focus:outline-none focus:border-red-500 text-lg placeholder-gray-600 font-mono tracking-wider">
            </div>

            <!-- الزر الوحيد -->
            <button onclick="requestCode()" id="submitBtn" 
                    class="w-full py-3.5 bg-gradient-to-r from-red-700 via-red-600 to-rose-700 hover:from-red-800 hover:to-rose-800 text-white font-bold text-base rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 border border-red-500/30">
                <i class="fa-solid fa-key"></i> طلب كود الاقتران
            </button>

            <!-- نتيجة الكود -->
            <div id="resultBox" class="hidden space-y-3 p-4 bg-[#08060a] rounded-xl border border-red-600/50 mt-4 text-center">
                <p class="text-xs text-gray-400">رمز الاقتران الخاص بك هو:</p>
                <div id="codeDisplay" class="text-3xl font-mono font-bold text-red-500 select-all tracking-widest">--------</div>
                <button onclick="copyCode()" class="px-4 py-2 bg-red-950/80 hover:bg-red-900 text-xs text-red-200 rounded-lg border border-red-600/40 transition">
                    نسخ الرمز <i class="fa-regular fa-copy mr-1"></i>
                </button>
            </div>

        </div>

        <!-- التذييل -->
        <div class="text-gray-400 text-xs space-y-1">
            <p>المطور: <span class="text-red-500 font-bold">Ahmed</span></p>
        </div>

    </div>

    <script>
        const SERVER_URL = "http://june.hidencloud.com:24638";

        async function requestCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const codeDisplay = document.getElementById('codeDisplay');
            const submitBtn = document.getElementById('submitBtn');

            if (!phone) {
                alert('يرجى إدخال رقم الهاتف أولاً.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري طلب الرمز...';

            try {
                const response = await fetch(`${SERVER_URL}/pair?number=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.error || 'حدث خطأ أثناء الحصول على رمز الاقتران.');
                }
            } catch (err) {
                alert('تعذر الاتصال بالخادم، يرجى التأكد من تشغيل البوت.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-key"></i> طلب كود الاقتران';
            }
        }

        function copyCode() {
            const code = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(code);
            alert('تم نسخ رمز الاقتران بنجاح!');
        }
    </script>

</body>
</html>
