<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGHT-BOT - نظام الاقتران</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* خلفية الفيديو */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.35) contrast(1.1);
        }

        /* طبقة تباين سوداء فوق الفيديو */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15,2,2,0.4) 0%, rgba(5,5,8,0.85) 100%);
            z-index: -1;
        }

        /* الكارت الرئيسي مع التوهج الأحمـر */
        .main-card {
            background: rgba(18, 12, 20, 0.75);
            backdrop-filter: blur(16px);
            border: 2px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.35), inset 0 0 15px rgba(239, 68, 68, 0.15);
        }

        /* المربع الأحمر المضيء حول الصورة */
        .avatar-red-box {
            width: 100px;
            height: 100px;
            border: 3px solid #ef4444;
            box-shadow: 0 0 20px #ef4444, inset 0 0 10px #ef4444;
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px #ef4444, inset 0 0 5px #ef4444;
                border-color: #ef4444;
            }
            100% {
                box-shadow: 0 0 30px #dc2626, inset 0 0 15px #dc2626;
                border-color: #f87171;
            }
        }

        /* الصندوق الداخلي للمدخلات */
        .inner-card {
            background: rgba(10, 8, 15, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* تأثير الحركة للعنوان */
        .light-title {
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- خلفية فيديو شغال لأنيميشن "لايت" -->
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-red-abstract-tunnel-loop-41564-large.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- الكارت الرئيسي -->
    <div class="max-w-md w-full main-card rounded-3xl p-6 text-center space-y-6">
        
        <!-- صورة لايت داخل مربع أحمر متوهج -->
        <div class="avatar-red-box mx-auto rounded-2xl p-1 flex items-center justify-center">
            <img src="https://i.supaimg.com/374589ce-56ae-4068-ba73-60f3b228637f/df4a4068-978a-4f77-afa8-bb5dd22968e1.jpg" 
                 alt="LIGHT" 
                 class="w-full h-full rounded-xl object-cover">
        </div>

        <!-- العنوان بالعربية الفصحى -->
        <div>
            <h1 class="text-3xl font-black text-red-500 tracking-wider light-title">LIGHT-BOT</h1>
            <p class="text-gray-300 text-sm mt-1.5 font-medium">احصل على كود الاقتران لربط البوت بسهولة</p>
        </div>

        <!-- صندوق المدخلات -->
        <div class="inner-card rounded-2xl p-5 text-right space-y-4">
            
            <!-- إدخال رقم الهاتف -->
            <div>
                <label class="text-red-300 text-xs font-bold flex items-center gap-1.5 mb-2">
                    <i class="fa-solid fa-mobile-screen-button text-red-500"></i> ادخل رقم الهاتف الخاص بك
                </label>
                <input type="tel" id="phoneInput" placeholder="مثال: 2189457××××××" 
                       class="w-full px-4 py-3 bg-[#08060a] text-red-100 border border-red-900/60 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 text-center text-lg dir-ltr placeholder-gray-600 font-mono">
            </div>

            <!-- اختيار السيرفر -->
            <div>
                <label class="text-red-300 text-xs font-bold flex items-center gap-1.5 mb-2">
                    <i class="fa-solid fa-server text-red-500"></i> اختر الخادم
                </label>
                <select class="w-full px-4 py-3 bg-[#08060a] text-gray-200 border border-red-900/60 rounded-xl focus:outline-none focus:border-red-500 text-sm font-medium">
                    <option value="1">الخادم الأول - دولة ليبيا 🇱🇾</option>
                </select>
            </div>

            <!-- زر طلب الكود الوحيد -->
            <button onclick="requestCode()" id="submitBtn" 
                    class="w-full py-3.5 bg-gradient-to-r from-red-700 via-red-600 to-rose-700 hover:from-red-800 hover:to-rose-800 text-white font-bold text-base rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 border border-red-500/30">
                <i class="fa-solid fa-key"></i> طلب كود الاقتران
            </button>

            <!-- صندوق ظهور الكود -->
            <div id="resultBox" class="hidden space-y-3 p-4 bg-[#08060a] rounded-xl border border-red-600/50 mt-4 text-center">
                <p class="text-xs text-gray-400">رمز الاقتران الخاص بك هو:</p>
                <div id="codeDisplay" class="text-3xl font-mono font-bold text-red-500 select-all tracking-widest">--------</div>
                <button onclick="copyCode()" class="px-4 py-2 bg-red-950/80 hover:bg-red-900 text-xs text-red-200 rounded-lg border border-red-600/40 transition">
                    نسخ الرمز <i class="fa-regular fa-copy mr-1"></i>
                </button>
            </div>

        </div>

        <!-- التذييل -->
        <div class="text-gray-500 text-xs space-y-1">
            <p>المطور: <span class="text-red-400 font-bold">LIGHT-BOT</span></p>
            <p>جميع الحقوق محفوظة © LIGHT 2026</p>
        </div>

    </div>

    <script>
        // رابط سيرفر HidenCloud
        const SERVER_URL = "http://june.hidencloud.com:24638";

        async function requestCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const codeDisplay = document.getElementById('codeDisplay');
            const submitBtn = document.getElementById('submitBtn');

            if (!phone) {
                alert('يرجى إدخال رقم الهاتف أولاً.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري طلب الرمز...';

            try {
                const response = await fetch(`${SERVER_URL}/pair?number=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.error || 'حدث خطأ أثناء الحصول على رمز الاقتران.');
                }
            } catch (err) {
                alert('تعذر الاتصال بالخادم، يرجى التأكد من تشغيل البوت.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-key"></i> طلب كود الاقتران';
            }
        }

        function copyCode() {
            const code = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(code);
            alert('تم نسخ رمز الاقتران بنجاح!');
        }
    </script>

</body>
</html>
        <!-- Bot Title -->

        </div>

        <!-- Inner Form Box -->
        <div class="inner-card rounded-2xl p-5 text-right space-y-4">
            
            <!-- Phone Input -->
            <div>
                <label class="text-slate-200 text-sm font-semibold flex items-center gap-1 mb-2">
                    📱 النمرة ديال الواتساب
                </label>
                <input type="tel" id="phoneInput" placeholder="مثال: 2189457××××××" 
                       class="w-full px-4 py-3 bg-[#0d0d14] text-slate-300 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500 text-center text-lg dir-ltr placeholder-slate-500">
            </div>

            <!-- Server Select -->
            <div>
                <label class="text-slate-200 text-sm font-semibold flex items-center gap-1 mb-2">
                    💻 ختار السيرفر
                </label>
                <select class="w-full px-4 py-3 bg-[#0d0d14] text-slate-200 border border-slate-700 rounded-xl focus:outline-none focus:border-purple-500">
                    <option value="1">السيرفر 1 - ليبيا 🇱🇾</option>
                </select>
            </div>

            <!-- Get Code Button -->
            <button onclick="requestCode()" id="submitBtn" 
                    class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                جيب كود الربط 🔑
            </button>

            <!-- Join Groups Button -->
            <a href="https://chat.whatsapp.com/D3TD0OUJcApJJ1NMTtDXzj" target="_blank" 
               class="w-full py-3.5 bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-700 hover:to-pink-700 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 block text-center">
                دخول المجموعات 👥
            </a>

            <!-- Contact Developer Button -->
            <a href="https://wa.me/218945778513" target="_blank" 
               class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 block text-center">
                تواصل مع المطور 📞
            </a>

            <!-- Result Box -->
            <div id="resultBox" class="hidden space-y-3 p-4 bg-[#0d0d14] rounded-xl border border-purple-500/50 mt-4 text-center">
                <p class="text-xs text-slate-400">كود الاقتران الخاص بك:</p>
                <div id="codeDisplay" class="text-3xl font-mono font-bold text-purple-400 select-all tracking-wider">--------</div>
                <button onclick="copyCode()" class="px-4 py-2 bg-purple-900/60 hover:bg-purple-800 text-xs text-purple-200 rounded-lg border border-purple-500/40 transition">
                    نسخ الكود 📋
                </button>
            </div>

        </div>

        <!-- Footer -->
        <div class="text-slate-500 text-xs space-y-1">
            <p>المطور: <span class="text-slate-400 font-bold">LIGHT-BOT</span></p>
            <p>LIGHT 2026 ©</p>
        </div>

    </div>

    <script>
        // رابط سيرفرك في HidenCloud
        const SERVER_URL = "http://june.hidencloud.com:24638";

        async function requestCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const codeDisplay = document.getElementById('codeDisplay');
            const submitBtn = document.getElementById('submitBtn');

            if (!phone) {
                alert('يرجى إدخال رقم الواتساب أولاً');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "جاري طلب الكود... ⏳";

            try {
                const response = await fetch(`${SERVER_URL}/pair?number=${encodeURIComponent(phone)}`);
                const data = await response.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.error || 'حدث خطأ أثناء طلب الكود');
                }
            } catch (err) {
                alert('فشل الاتصال بالسيرفر، تأكد من تشغيل البوت!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "جيب كود الربط 🔑";
            }
        }

        function copyCode() {
            const code = document.getElementById('codeDisplay').innerText;
            navigator.clipboard.writeText(code);
            alert('تم نسخ الكود بنجاح!');
        }
    </script>

</body>
</html>
