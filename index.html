<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🟢 تم تغيير العنوان هنا -->
    <title>تنصيب لايت بوت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #141414;
            border: 1.5px solid #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
        }

        /* 🎥 مشغل الفيديو */
        .video-avatar {
            width: 130px;
            height: 130px;
            border-radius: 20px;
            border: 2px solid #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.5);
            object-fit: cover;
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #e6e6e6;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px;
            background-color: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            direction: ltr;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="tel"]:focus {
            border-color: #ff1a1a;
        }

        /* ⚠️ رسالة الخطأ المباشرة تحت الإدخال */
        .error-message {
            display: none;
            background-color: rgba(255, 26, 26, 0.1);
            border: 1px solid #ff1a1a;
            color: #ff4d4d;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            line-height: 1.4;
        }

        /* 🟢 منطقة عرض كود الاقتران */
        .code-container {
            display: none;
            margin-top: 15px;
            background-color: #1a1a1a;
            border: 1px dashed #00ff66;
            padding: 15px;
            border-radius: 10px;
        }

        .code-text {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #00ff66;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b0000, #4a0000);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff1a1a, #8b0000);
            box-shadow: 0 0 10px rgba(255, 26, 26, 0.5);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #666666;
        }

        .footer span {
            color: #ff1a1a;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 🎥 الفيديو الخاص بالبوت -->
        <video class="video-avatar" autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/3kxthy.mp4" type="video/mp4">
            متصفحك لا يدعم تشغيل الفيديو.
        </video>
        
        <div class="title">ربط البوت عبر كود الاقتران</div>

        <form id="pairForm">
            <div class="input-group">
                <!-- 🟢 تم تعديل الـ placeholder أدناه -->
                <input type="tel" id="phoneNumber" placeholder="21894577××××××" required autocomplete="off">
            </div>

            <!-- ⚠️ رسائل الأخطاء في الصفحة -->
            <div id="errorMessage" class="error-message"></div>

            <!-- 🟢 عرض كود الاقتران -->
            <div id="codeContainer" class="code-container">
                <div style="font-size: 12px; color: #aaa; margin-bottom: 5px;">كود الاقتران الخاص بك:</div>
                <div id="pairCode" class="code-text">------</div>
            </div>

            <button type="submit" id="submitBtn" class="btn">طلب كود الاقتران</button>
        </form>

        <div class="footer">
            المطور: <span>Ahmed</span>
        </div>
    </div>

    <script>
        const pairForm = document.getElementById('pairForm');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const errorMessage = document.getElementById('errorMessage');
        const codeContainer = document.getElementById('codeContainer');
        const pairCodeDisplay = document.getElementById('pairCode');
        const submitBtn = document.getElementById('submitBtn');

        function showError(msg) {
            codeContainer.style.display = 'none';
            errorMessage.innerText = msg;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
            errorMessage.innerText = '';
        }

        pairForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const phone = phoneNumberInput.value.trim().replace(/[^0-9]/g, '');

            if (!phone) {
                showError('يرجى كتابة رقم الهاتف بشكل صحيح بدون رموز أو فواصل.');
                return;
            }

            submitBtn.innerText = 'جاري الاتصال بالخادم...';
            submitBtn.disabled = true;

            try {
                const response = await fetch(`/pair?number=${phone}`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'فشل الحصول على كود الاقتران من السيرفر.');
                }

                if (data.code) {
                    pairCodeDisplay.innerText = data.code;
                    codeContainer.style.display = 'block';
                } else {
                    showError('لم يتم إرجاع كود اقتران من الخادم، يرجى المحاولة لاحقاً.');
                }

            } catch (err) {
                showError('تعذر الاتصال بالخادم، يرجى التأكد من تشغيل البوت.');
            } finally {
                submitBtn.innerText = 'طلب كود الاقتران';
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
